<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Draw and analyze organic molecules, compare acid-base behavior, and predict supported reactions."
    />
    <meta name="theme-color" content="#070b14" />
    <script>
      /* Apply the saved/system theme before first paint to avoid a flash. Mirrors src/theme/useTheme.ts. */
      (function () {
        try {
          var pref = localStorage.getItem("pocketchem.theme");
          var light = pref === "light" || ((pref !== "dark") && window.matchMedia("(prefers-color-scheme: light)").matches);
          document.documentElement.dataset.theme = light ? "light" : "dark";
        } catch (e) { document.documentElement.dataset.theme = "dark"; }
      })();
    </script>
    <title>PocketChem</title>
  </head>
  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
